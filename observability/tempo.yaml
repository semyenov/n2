stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks

backend_scheduler:
  # Tempo's local all-in-one target runs a backend worker. In an idle dev stack
  # it long-polls the scheduler, then logs "no jobs found" when the poll times out.
  job_timeout: 1h

usage_report:
  reporting_enabled: false
