name: CI

on:
  push:
    branches: [main, new]
  pull_request:
    branches: [main, new]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx tsc --noEmit
      - run: cd packages/n2 && bun test
      - run: cd services/profiler && bun test
      - run: cd examples/order && bun test
